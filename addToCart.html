<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | KSAM Deal</title>
    <meta name="description" content="Review your selected items, apply discounts, and proceed to checkout securely on KSAM Deal.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://abh207.github.io/KSAM-deal-ecommerce-website/addToCart.html">
    <meta name="theme-color" content="#0b1f1a">

    <!-- Favicon & Touch Icons -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%assets/images/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="%BASE_URL%assets/images/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%assets/images/favicon-192x192.png">
    <link rel="apple-touch-icon" href="%BASE_URL%assets/images/apple-touch-icon.png">

    <!-- Open Graph / Facebook -->
    <meta property="og:site_name" content="KSAM Deal">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://abh207.github.io/KSAM-deal-ecommerce-website/addToCart.html">
    <meta property="og:title" content="Shopping Cart | KSAM Deal">
    <meta property="og:description" content="Review your selected items, apply discounts, and proceed to checkout securely on KSAM Deal.">
    <meta property="og:image" content="https://abh207.github.io/KSAM-deal-ecommerce-website/assets/images/logo-512.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://abh207.github.io/KSAM-deal-ecommerce-website/addToCart.html">
    <meta name="twitter:title" content="Shopping Cart | KSAM Deal">
    <meta name="twitter:description" content="Review your selected items, apply discounts, and proceed to checkout securely on KSAM Deal.">
    <meta name="twitter:image" content="https://abh207.github.io/KSAM-deal-ecommerce-website/assets/images/logo-512.png">

    <!-- Google Fonts: Plus Jakarta Sans & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    >

    <!-- Base Website CSS -->
    <link
        rel="stylesheet"
        href="./src/style.css"
    >

    <!-- Modern Dark Cart Page CSS -->
    <link
        rel="stylesheet"
        href="./src/cart/cartPage.css"
    >
</head>


<body>

    <!-- =====================================================
         MODERN REACT NAVBAR MOUNT POINT
         Mounts shared KSAM Deal React Navbar component
         ===================================================== -->
    <div id="cart-navbar-root"></div>


    <!-- =====================================================
         MAIN CART SECTION
         ===================================================== -->
    <main class="addToCartElement">
        <div class="cart-page-container">

            <!-- 1. Top Header Navigation & Banner -->
            <header class="cart-page-header">
                <div class="cart-header-top-nav">
                    <!-- Breadcrumbs: Home > Cart -->
                    <nav class="cart-breadcrumbs" aria-label="Breadcrumb navigation">
                        <a href="./shop.html" class="cart-breadcrumb-item">
                            <i class="fa-solid fa-house" style="font-size: 11px;"></i>
                            <span>Home</span>
                        </a>
                        <span class="cart-breadcrumb-separator">›</span>
                        <span class="cart-breadcrumb-item current" aria-current="page">Cart</span>
                    </nav>

                    <!-- 3-step progress indicator: Cart → Address → Payment -->
                    <div class="cart-stepper-progress" aria-label="Checkout Progress">
                        <div class="stepper-step active" aria-current="step">
                            <span class="stepper-num">1</span>
                            <span class="stepper-label">Cart</span>
                        </div>
                        <div class="stepper-line"></div>
                        <div class="stepper-step">
                            <span class="stepper-num">2</span>
                            <span class="stepper-label">Address</span>
                        </div>
                        <div class="stepper-line"></div>
                        <div class="stepper-step">
                            <span class="stepper-num">3</span>
                            <span class="stepper-label">Payment</span>
                        </div>
                    </div>

                    <a href="./shop.html" class="cart-back-link cart-continue-shopping-top">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Continue Shopping</span>
                    </a>
                </div>

                <!-- Page Title Block: Title + Total Count Pill, Subtitle directly below -->
                <div class="cart-page-title-block">
                    <div class="cart-page-title-row">
                        <h1 class="cart-page-title">
                            Shopping Cart
                            <span class="cart-page-title-count" id="headerCartCount">0 items</span>
                        </h1>
                    </div>
                    <p class="cart-page-subtitle">Review your selected items, apply promotional coupons, and proceed to secure checkout.</p>
                </div>
            </header>


            <!-- 2. "Your Items" Heading & 3. Cart Items Single Column -->
            <section class="cart-products-area" aria-label="Shopping Cart Items">
                <div class="your-items-header-bar">
                    <div class="your-items-title-wrap">
                        <h2>Your Items</h2>
                        <span class="items-count-pill" id="yourItemsCountBadge">0 items</span>
                    </div>

                    <a href="./shop.html" class="cart-back-link">
                        <span>Continue Shopping</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </a>
                </div>

                <!-- Products Cart List Mount (single column) -->
                <div id="productCartContainer"></div>

                <!-- 4. Saved for Later Section Mount (only displayed if items exist) -->
                <div id="savedForLaterContainer" class="saved-later-section" style="display: none;"></div>
            </section>


            <!-- 5. Checkout Area (Moved below all cart items) -->
            <section class="cart-checkout-bottom-area" id="cartCheckoutBottomArea" aria-label="Delivery, Coupons and Order Summary">
                <div class="checkout-area-grid">
                    <!-- Left Column on Desktop (>=1024px): Delivery Address & Coupon -->
                    <div class="checkout-left-col">
                        <!-- 1. Delivery Address Card Mount -->
                        <div id="cartAddressCard"></div>

                        <!-- 2. Coupon Code Section Mount -->
                        <div id="cartCouponContainer"></div>
                    </div>

                    <!-- Right Column on Desktop (>=1024px): Order Summary Card -->
                    <div class="checkout-right-col">
                        <!-- 3. Order Summary & Price Breakdown Mount -->
                        <div id="cartOrderSummaryContainer"></div>
                    </div>
                </div>
            </section>

        </div>
    </main>







    <!-- =====================================================
         SCRIPTS: React Navbar & Footer Mount, Cart Manager
         ===================================================== -->
    <script
        type="module"
        src="./src/cart/cartPageMount.jsx"
    ></script>

    <script
        type="module"
        src="./src/cart/cartManager.js"
    ></script>

</body>

</html>
