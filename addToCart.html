<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link 
  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header class = "section navbar">
  <section class="top-txt">
    <div class="header-container">
      <div class="head-txt">
        <p>free shoping. 30-days free return and refund guarantee</p>
      </div>
      <div class="sign-in-up">
        <a href="#" class="sign">
          SIGN IN
        </a>
        <a href="#" class="sign">
          SIGN UP
        </a>
      </div>
    </div>
  </section>
  <div class="container">
    <div class="navbar-brand">
      <a href="#" target="_blank">
        <img src="./ksam-deal logo.png"
         alt="KSAM Deal Logo" 
         class="logo" 
         >
      </a>
    </div>
    <nav class="navbar">
      <ul>
        <li class="nav-item">
          <a href="/index.html" class="nav-link">Home</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">ChatBox</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">About</a>
        </li>
        <li class="nav-item">
          <a href="../src/Product.html" class="nav-link">Products</a>
        </li>
        <li class="nav-item">
          <a href="../src/contact.html" class="nav-link">Contact</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link-cart" id="cartValue">
            <i class="fa-sharp fa-solid fa-cart-shopping">0</i>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<!-- Start of main content part -->

<section class="addToCartElement">
  <div class="container">
    <section>
      <div id="productCartContainer"></div>
    </section>
    <section class="productCartTotalElem">
      <div class="productCartTotalElement">
        <p>Selected Offer Summary</p>
        <div class="productOrderTotal">
          <div>
            <p>Sub Total:</p>
            <p class="productSubTotal">0</p>
          </div>
          <div>
            <p>Tax:</p>
            <p class="ProductTax">$50</p>
          </div>
          <hr>
          <div>
            <p>
              Final Total:
            </p>
            <p class="productFinalTotal">0</p>
          </div>
        </div>
      </div>
    </section>
  </div>
</section>

<template id="productCartTemplate">
  <div class="cards" id="cardValue">
    <article class="information card">
      <div>
        <span class="category"></span>
      </div>
      <div class="imageContainer">
        <img src="" alt="" class="productImage">
      </div>
      <h2 class="productName"></h2>
      <p class="productPrice"></p>
      <div class="stockElement">
        <button class="cartIncrement">+</button>
        <p class="productQuantity" data-quantity="1">1</p>
        <button class="cartDecrement">-</button>
      </div>

      <button class="add-to-cart-button remove-to-cart-button">
        Remove
      </button>
    </article>
  </div>
</template>

<!-- End of main content part -->
<footer class="section-footer">
    <script src="/src/footer.js"></script>
</footer>

<script type="module" src="./src/addToCart.js"></script>
</body>
</html>
