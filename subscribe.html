<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="green">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Membership Checkout | KSAM Deal</title>
    <meta name="description" content="Subscribe to KSAM Deal membership for exclusive price drop alerts, deal tracking, and personalized recommendations.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://abh207.github.io/KSAM-deal-ecommerce-website/subscribe.html">
    <meta name="theme-color" content="#050a02">

    <!-- Favicon & Touch Icons -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%assets/images/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="%BASE_URL%assets/images/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%assets/images/favicon-192x192.png">
    <link rel="apple-touch-icon" href="%BASE_URL%assets/images/apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Theme Initialization Script -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('ksam_theme_pref') || 'dark';
          var a = localStorage.getItem('ksam_accent_pref') || 'green';
          var effective = t;
          if (t === 'auto') {
            effective = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', effective);
          document.documentElement.setAttribute('data-accent', a);
        } catch(e) {}
      })();
    </script>
</head>

<body class="bg-[#050a02] text-white font-['Plus_Jakarta_Sans',sans-serif] antialiased min-h-screen selection:bg-[#84FF00] selection:text-black">

    <div id="subscribe-root"></div>

    <!-- React Checkout App -->
    <script type="module" src="./src/subscribe/subscribeMain.jsx"></script>

</body>

</html>
