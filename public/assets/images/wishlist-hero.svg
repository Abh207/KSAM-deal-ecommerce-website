<svg viewBox="0 0 540 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="screenBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#061a10" />
      <stop offset="50%" stopColor="#0b2416" />
      <stop offset="100%" stopColor="#020d07" />
    </linearGradient>
    <radialGradient id="screenCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#4ade80" stopOpacity="0.45" />
      <stop offset="60%" stopColor="#22c55e" stopOpacity="0.15" />
      <stop offset="100%" stopColor="#052e16" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="laptopHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#86efac" />
      <stop offset="50%" stopColor="#4ade80" />
      <stop offset="100%" stopColor="#16a34a" />
    </linearGradient>
    <linearGradient id="badgeHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#4ade80" />
      <stop offset="100%" stopColor="#16a34a" />
    </linearGradient>
    <linearGradient id="phoneScreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#052e16" />
      <stop offset="60%" stopColor="#14532d" />
      <stop offset="100%" stopColor="#22c55e" />
    </linearGradient>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" floodColor="#000000" floodOpacity="0.14" />
    </filter>
    <filter id="heartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlowSparkle" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ground Soft Shadows -->
  <ellipse cx="270" cy="272" rx="230" ry="18" fill="rgba(15, 23, 42, 0.07)" />
  <ellipse cx="270" cy="272" rx="170" ry="12" fill="rgba(15, 23, 42, 0.09)" />

  <!-- Left Potted Plant -->
  <g id="left-plant" transform="translate(68, 206)">
    <ellipse cx="26" cy="62" rx="20" ry="5" fill="rgba(0,0,0,0.12)" />
    <path d="M12 40 L16 62 Q26 65 36 62 L40 40 Z" fill="#e2e8f0" stroke="#cbd5e1" strokeWidth="1.5" />
    <ellipse cx="26" cy="40" rx="14" ry="4" fill="#cbd5e1" />
    <ellipse cx="26" cy="40" rx="12" ry="3" fill="#475569" />
    <path d="M26 39 Q20 22 10 24 Q16 32 24 39 Z" fill="#15803d" />
    <path d="M26 39 Q26 12 18 10 Q22 24 26 39 Z" fill="#22c55e" />
    <path d="M26 39 Q32 18 40 18 Q34 28 27 39 Z" fill="#16a34a" />
    <path d="M26 39 Q36 28 44 32 Q36 38 28 40 Z" fill="#4ade80" />
  </g>

  <!-- Leaning Phone -->
  <g id="phone-leaning" transform="translate(142, 148) rotate(-7)">
    <rect x="0" y="0" width="58" height="114" rx="12" fill="#111827" stroke="#1f2937" strokeWidth="2" />
    <rect x="3.5" y="4" width="51" height="106" rx="9" fill="url(#phoneScreenGrad)" />
    <rect x="22" y="7" width="14" height="3" rx="1.5" fill="#111827" />
    <rect x="10" y="24" width="38" height="26" rx="5" fill="rgba(255,255,255,0.18)" />
    <path d="M29 34 C29 32 26 30 24 32 C21 34 24 37 29 41 C34 37 37 34 34 32 C32 30 29 32 29 34 Z" fill="#ffffff" />
    <rect x="10" y="58" width="38" height="4" rx="2" fill="rgba(255,255,255,0.4)" />
    <rect x="10" y="66" width="26" height="4" rx="2" fill="rgba(255,255,255,0.3)" />
    <rect x="10" y="74" width="32" height="4" rx="2" fill="rgba(255,255,255,0.2)" />
    <rect x="20" y="103" width="18" height="2" rx="1" fill="rgba(255,255,255,0.5)" />
  </g>

  <!-- Dark Laptop -->
  <g id="laptop" transform="translate(186, 70)">
    <rect x="18" y="0" width="220" height="152" rx="12" fill="#0f172a" stroke="#1e293b" strokeWidth="2.5" />
    <rect x="24" y="6" width="208" height="138" rx="8" fill="#020617" />
    <rect x="28" y="10" width="200" height="130" rx="5" fill="url(#screenBgGrad)" />
    <circle cx="128" cy="75" r="70" fill="url(#screenCenterGlow)" />
    <circle cx="128" cy="7" r="1.5" fill="#334155" />
    <g filter="url(#heartGlow)">
      <path d="M128 98 C110 82 86 64 86 46 A23 23 0 0 1 128 35 A23 23 0 0 1 170 46 C170 64 146 82 128 98 Z" fill="url(#laptopHeartGrad)" />
    </g>
    <path d="M102 40 C96 44 94 52 96 58 C98 52 104 46 112 43 C108 41 105 40 102 40 Z" fill="#ffffff" opacity="0.5" />
    <path d="M0 152 L256 152 L272 176 Q274 180 268 180 L-12 180 Q-18 180 -16 176 Z" fill="#1e293b" stroke="#0f172a" strokeWidth="1.5" />
    <path d="M-12 180 L268 180 L266 183 L-10 183 Z" fill="#090d16" />
    <rect x="108" y="154" width="40" height="3" rx="1.5" fill="#090d16" />
    <line x1="20" y1="156" x2="236" y2="156" stroke="#4ade80" strokeWidth="1.5" strokeOpacity="0.4" />
  </g>

  <!-- Right Potted Plant -->
  <g id="right-plant" transform="translate(422, 150)">
    <ellipse cx="36" cy="120" rx="30" ry="7" fill="rgba(0,0,0,0.12)" />
    <path d="M16 80 L22 118 Q36 124 50 118 L56 80 Z" fill="#ffffff" stroke="#e2e8f0" strokeWidth="2" />
    <ellipse cx="36" cy="80" rx="20" ry="5" fill="#f1f5f9" />
    <ellipse cx="36" cy="80" rx="18" ry="4" fill="#334155" />
    <path d="M36 78 Q22 40 14 18 Q26 30 36 78 Z" fill="#15803d" />
    <path d="M36 78 Q36 28 42 6 Q44 26 36 78 Z" fill="#22c55e" />
    <path d="M36 78 Q52 42 66 22 Q54 44 38 78 Z" fill="#16a34a" />
    <path d="M36 78 Q48 58 68 52 Q56 66 38 78 Z" fill="#4ade80" />
    <path d="M36 78 Q20 54 4 48 Q16 62 34 78 Z" fill="#16a34a" />
  </g>

  <!-- Floating Badge -->
  <g class="ksam-wishlist-hero-badge-float" transform="translate(136, 42)">
    <g filter="url(#badgeShadow)">
      <circle cx="28" cy="28" r="28" fill="#ffffff" stroke="#e5e7eb" strokeWidth="1.5" />
      <path d="M28 38 C20 30 9 22 9 14 A9 9 0 0 1 28 9 A9 9 0 0 1 47 14 C47 22 36 30 28 38 Z" fill="url(#badgeHeartGrad)" />
    </g>
  </g>

  <!-- Floating Sparkles -->
  <g class="ksam-wishlist-sparkle-1" transform="translate(426, 48)">
    <path d="M10 0 L12 7 L19 10 L12 13 L10 20 L8 13 L1 10 L8 7 Z" fill="#4ade80" filter="url(#softGlowSparkle)" />
  </g>
  <g class="ksam-wishlist-sparkle-2" transform="translate(90, 80)">
    <path d="M8 0 L9.5 5.5 L15 8 L9.5 10.5 L8 16 L6.5 10.5 L1 8 L6.5 5.5 Z" fill="#22c55e" />
  </g>
  <circle cx="474" cy="116" r="3.5" fill="#4ade80" opacity="0.85" />
  <circle cx="106" cy="164" r="2.5" fill="#86efac" opacity="0.8" />
  <circle cx="400" cy="94" r="2" fill="#22c55e" opacity="0.75" />
</svg>
