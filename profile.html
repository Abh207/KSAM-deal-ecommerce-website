<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your KSAM Deal customer profile, addresses, preferences, and account security.">
    <title>My Profile | KSAM Deal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('ksam_theme_pref') || 'dark';
          var a = localStorage.getItem('ksam_accent_pref') || 'green';
          var effective = t;
          if (t === 'auto') {
            effective = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', effective);
          document.documentElement.setAttribute('data-accent', a);
        } catch(e) {}
      })();
    </script>
</head>

<body style="margin: 0; min-height: 100vh;">
    <div id="profile-root"></div>
    <script type="module" src="./src/profile/ProfileMain.jsx"></script>
</body>

</html>
