<body style="background: transparent; margin: 0; overflow-x: hidden;">

    <!-- Background Video for the whole page except the hero (Part 2) -->
    <div class="bg-video-wrap" aria-hidden="true">
        <video id="page-bg-video" class="bg-video" autoplay muted loop playsinline preload="auto">
            <source src="./assets/videos/shoes-bg.mp4" type="video/mp4">
        </video>
        <div class="bg-video-overlay"></div>
    </div>

    <div id="shoes-root"></div>

    <script>
    console.log("SHOES HTML IS RUNNING");
    // Background video lifecycle & performance
    (function() {
        var video = document.getElementById("page-bg-video");
        var wrap = document.querySelector(".bg-video-wrap");
        if (!video || !wrap) return;

        var prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var saveData = navigator.connection && navigator.connection.saveData;

        if (prefersReducedMotion || saveData) {
            video.pause();
            wrap.classList.add("bg-fallback");
            return;
        }

        video.addEventListener("error", function() {
            wrap.classList.add("bg-fallback");
        });

        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === "hidden") {
                video.pause();
            } else {
                video.play().catch(function() {});
            }
        });

        var playPromise = video.play();
        if (playPromise !== undefined) {
            playPromise.catch(function() {
                var startPlay = function() {
                    video.play().catch(function() {});
                };
                window.addEventListener("pointerdown", startPlay, { once: true });
                window.addEventListener("keydown", startPlay, { once: true });
            });
        }
    })();
    </script>
