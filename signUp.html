<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign-UP</title>

    <link rel="stylesheet" href="./src/style.css">
</head>
<body class="signUpBody">
    <!-- <video class="signupBackgroundVideo" autoplay muted loop playsinline width="600">
        <source src="../public/backgroundimage2.mp4" type="video/mp4">
    </video> -->

    <main class="SignUpMainTag">
        <div class="signUPmain">
            <div class="contcontainerMain">
                <div class="signUpform">
                    <div class="signlogo">
                        <img src="./public/ksamDealPNGImg.png" alt="">
                    </div>
                    <div class="signformmainContent">
                        <div class="headpara">
                            <h2 class="signupHead">
                                Create New Account
                            </h2>
                            <p class="signUpPara">
                                Sign up and get a 30-days free trial
                            </p>
                        </div>
                        <div class="signForm">
                            <form action="">
                                <div>
                                    <label for="fullName">
                                        Full name
                                    </label>
                                    <input type="text" name="name" id="name">
                                </div>
                                <div>
                                    <label for="email">
                                        Email
                                    </label>
                                    <input type="email" name="email" id="email">
                                </div>
                                <div>
                                    <label for="password">
                                        Password
                                    </label>
                                    <input type="password" name="password" id="password" required>
                                </div>
                                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 1.125rem;">
                                    <input type="checkbox" id="termsAgree" name="terms" required style="width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: #25db25;">
                                    <label for="termsAgree" style="margin: 0; font-size: 0.75rem; color: #777; cursor: pointer;">
                                        I agree to the <a href="#" style="color: #222; font-weight: 600; text-decoration: underline;">Terms and Privacy Policy</a>
                                    </label>
                                </div>
                                <div>
                                    <button id="signButton" type="submit">
                                        Submit
                                    </button>
                                </div>
                                <div class="appGoogle">
                                    <div class="apple">
                                        <img src="./public/apple.png" alt="Apple">
                                        <a href="#" class="appleLink">Apple</a>
                                    </div>

                                    <div class="googl">
                                        <img src="./public/google.png" alt="Google">
                                        <a href="#" class="googleLink">Google</a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="signUplastContent">
                        <div class="signUpLoginLink">
                            <p class="signUplastContfirstTest">
                                Have any account? <a href="./login.html">Sign in</a>
                            </p>
                        </div>
                        <div class="signUpterm">
                            <a href="#">
                                Term and Conditions
                            </a>
                        </div>
                    </div>
                </div>
                <div class="signUpimg">
                    <img
                        src="./public/signupImage.png"
                        alt="Ksam Deal"
                    >
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="./src/auth/signUp.js"></script>
</body>
</html>
