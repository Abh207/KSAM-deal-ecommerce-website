<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign-Up | KSAM Deal</title>

    <link rel="stylesheet" href="./src/style.css">
    <link rel="stylesheet" href="./src/styles/kx-tokens.css">
    <link rel="stylesheet" href="./src/styles/kx-motion.css">
</head>
<body class="signUpBody kx-page">
    <main class="SignUpMainTag">
        <div class="signUPmain">
            <div class="contcontainerMain">
                <div class="signUpform">
                    <div class="signlogo">
                        <img src="./public/ksamDealPNGImg.png" alt="KSAM Deal">
                    </div>
                    <div class="signformmainContent">
                        <!-- Heading & Subtitle -->
                        <div class="headpara">
                            <h2 class="signupHead" id="authTitle">
                                Create New Account
                            </h2>
                            <p class="signUpPara" id="authSubtitle">
                                Sign up with your email to get started
                            </p>
                        </div>

                        <!-- Status Alert Banner -->
                        <div id="authStatusMessage" style="display: none; margin-bottom: 1.125rem; padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.8rem; font-weight: 600; line-height: 1.4; text-align: center;"></div>

                        <div class="signForm">
                            <!-- =========================================================
                                 STEP 1: REGISTRATION FORM
                            ========================================================= -->
                            <form id="step1RegistrationForm">
                                <!-- Full Name -->
                                <div>
                                    <label for="name">
                                        Full Name
                                    </label>
                                    <input type="text" name="name" id="name" placeholder="Enter your full name" required autocomplete="name">
                                </div>

                                <!-- Email -->
                                <div>
                                    <label for="email">
                                        Email Address
                                    </label>
                                    <input
                                        type="email"
                                        name="email"
                                        id="email"
                                        placeholder="name@example.com"
                                        required
                                        autocomplete="email"
                                    >
                                </div>

                                <!-- Password -->
                                <div>
                                    <label for="password">
                                        Password (min. 6 characters)
                                    </label>
                                    <input
                                        type="password"
                                        name="password"
                                        id="password"
                                        placeholder="Create a strong password"
                                        required
                                        minlength="6"
                                        autocomplete="new-password"
                                    >
                                </div>

                                <!-- Confirm Password -->
                                <div>
                                    <label for="confirmPassword">
                                        Confirm Password
                                    </label>
                                    <input
                                        type="password"
                                        name="confirmPassword"
                                        id="confirmPassword"
                                        placeholder="Re-enter your password"
                                        required
                                        minlength="6"
                                        autocomplete="new-password"
                                    >
                                </div>

                                <!-- Terms Checkbox -->
                                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 1.125rem;">
                                    <input type="checkbox" id="termsAgree" name="terms" required style="width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: var(--kx-accent, #25db25);">
                                    <label for="termsAgree" style="margin: 0; font-size: 0.75rem; color: var(--kx-text-muted, #777); cursor: pointer; text-transform: none; font-weight: normal;">
                                        I agree to the <a href="./terms.html" target="_blank" style="color: var(--kx-text, #fff); font-weight: 600; text-decoration: underline;">Terms</a> and <a href="./privacy-policy.html" target="_blank" style="color: var(--kx-text, #fff); font-weight: 600; text-decoration: underline;">Privacy Policy</a>
                                    </label>
                                </div>

                                <!-- Submit Button -->
                                <div>
                                    <button id="signButton" type="submit">
                                        Send Verification Code
                                    </button>
                                </div>

                                <!-- Social Sign-in -->
                                <div class="appGoogle">
                                    <div class="apple">
                                        <img src="./public/apple.png" alt="Apple">
                                        <a href="#" class="appleLink">Continue with Apple</a>
                                    </div>

                                    <div class="googl">
                                        <img src="./public/google.png" alt="Google">
                                        <a href="#" class="googleLink">Continue with Google</a>
                                    </div>
                                </div>
                            </form>

                            <!-- =========================================================
                                 STEP 2: OTP VERIFICATION FORM (Initially Hidden)
                            ========================================================= -->
                            <form id="step2OtpForm" style="display: none;">
                                <div>
                                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
                                        <label style="margin: 0;">
                                            Enter 6-Digit Code
                                        </label>
                                        <a href="#" id="changeEmailLink" class="kx-change-number">
                                            Change Email
                                        </a>
                                    </div>

                                    <!-- 6 Individual OTP Boxes -->
                                    <div class="kx-otp-boxes" id="otpContainer">
                                        <input type="text" class="kx-otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="0" autocomplete="one-time-code" aria-label="Digit 1">
                                        <input type="text" class="kx-otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="1" aria-label="Digit 2">
                                        <input type="text" class="kx-otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="2" aria-label="Digit 3">
                                        <input type="text" class="kx-otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="3" aria-label="Digit 4">
                                        <input type="text" class="kx-otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="4" aria-label="Digit 5">
                                        <input type="text" class="kx-otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="5" aria-label="Digit 6">
                                    </div>
                                </div>

                                <!-- Verify Button -->
                                <div>
                                    <button id="verifyOtpButton" type="submit" style="width: 100%; height: 2.9375rem; border: none; outline: none; border-radius: 1.5625rem; background: linear-gradient(135deg, var(--kx-accent, #22ff88) 0%, var(--kx-accent-highlight, #80ffbb) 100%); color: #07090b; font-size: 0.875rem; font-weight: 800; cursor: pointer; transition: transform 0.25s ease, box-shadow 0.25s ease;">
                                        Verify & Activate Account
                                    </button>
                                </div>

                                <!-- Resend Code & Countdown -->
                                <div class="kx-resend-row">
                                    <span>Didn't receive the email code?</span>
                                    <button type="button" id="resendOtpBtn" class="kx-resend-btn" disabled>
                                        Resend Code (<span id="resendTimer">60</span>s)
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="signUplastContent">
                        <div class="signUpLoginLink">
                            <p class="signUplastContfirstTest">
                                Already have an account? <a href="./login.html">Sign in</a>
                            </p>
                        </div>
                        <div class="signUpterm">
                            <a href="./terms.html">
                                Terms and Conditions
                            </a>
                        </div>
                    </div>
                </div>
                <div class="signUpimg">
                    <img
                        src="./public/signupImage.png"
                        alt="KSAM Deal"
                    >
                </div>
            </div>
        </div>
    </main>
    <script type="module" src="./src/auth/signUp.js"></script>
</body>
</html>
