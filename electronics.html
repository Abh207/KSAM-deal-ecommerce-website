        .bg-video-wrap {
            position: fixed;
            inset: 0;

            height: 100vh;
            height: 100dvh;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;

        }

        .bg-video-wrap.bg-fallback {
            background: linear-gradient(135deg, #0b0f0e, #121816) !important;
        }

        .bg-video-wrap.bg-fallback .bg-video {
            display: none !important;
        }

        .bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .bg-video-overlay {
            position: absolute;
            inset: 0;

<body style="background: transparent; margin: 0; overflow-x: hidden;">

    <!-- Background Video for the whole electronics page (Part 1) -->
    <div class="bg-video-wrap" aria-hidden="true">
        <video class="bg-video" autoplay muted loop playsinline preload="auto">
            <source src="./assets/videos/electronics-bg-2.mp4" type="video/mp4">
        </video>
        <div class="bg-video-overlay"></div>
    </div>

    <!-- =====================================================
         REACT ROOT
         ===================================================== -->

    <div id="shop-root"></div>

    <script type="module" src="./src/react-shop/shopMain.jsx"></script>

    <script>
    (function() {
        var video = document.querySelector(".bg-video");
        var wrap = document.querySelector(".bg-video-wrap");
        if (!video || !wrap) return;

        var prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var saveData = navigator.connection && navigator.connection.saveData;

        if (prefersReducedMotion || saveData) {
            try { video.pause(); } catch(e) {}
            wrap.classList.add("bg-fallback");
            return;
        }

        video.addEventListener("error", function() {
            wrap.classList.add("bg-fallback");
        });

        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === "hidden") {
                try { video.pause(); } catch(e) {}
            } else {
                try {
                    var p = video.play();
                    if (p !== undefined) p.catch(function() {});
                } catch(e) {}
            }
        });

        try {
            var playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(function() {
                    var startPlay = function() {
                        try { video.play().catch(function() {}); } catch(e) {}
                    };
                    window.addEventListener("pointerdown", startPlay, { once: true });
                    window.addEventListener("keydown", startPlay, { once: true });
                });
            }
        } catch(e) {}
    })();
    </script>
