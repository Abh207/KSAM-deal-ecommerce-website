<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In to Your Account | KSAM Deal</title>
    <meta name="description" content="Log in to access your orders, saved deals, and personalized recommendations on KSAM Deal.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://abh207.github.io/KSAM-deal-ecommerce-website/login.html">
    <meta name="theme-color" content="#0b1f1a">

    <!-- Favicon & Touch Icons -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%assets/images/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="%BASE_URL%assets/images/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%assets/images/favicon-192x192.png">
    <link rel="apple-touch-icon" href="%BASE_URL%assets/images/apple-touch-icon.png">

    <!-- Open Graph / Facebook -->
    <meta property="og:site_name" content="KSAM Deal">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://abh207.github.io/KSAM-deal-ecommerce-website/login.html">
    <meta property="og:title" content="Sign In to Your Account | KSAM Deal">
    <meta property="og:description" content="Log in to access your orders, saved deals, and personalized recommendations on KSAM Deal.">
    <meta property="og:image" content="https://abh207.github.io/KSAM-deal-ecommerce-website/assets/images/logo-512.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://abh207.github.io/KSAM-deal-ecommerce-website/login.html">
    <meta name="twitter:title" content="Sign In to Your Account | KSAM Deal">
    <meta name="twitter:description" content="Log in to access your orders, saved deals, and personalized recommendations on KSAM Deal.">
    <meta name="twitter:image" content="https://abh207.github.io/KSAM-deal-ecommerce-website/assets/images/logo-512.png">

    <link rel="stylesheet" href="./src/style.css">
    <link rel="stylesheet" href="./src/styles/kx-tokens.css">
    <link rel="stylesheet" href="./src/styles/kx-motion.css">
</head>

<body class="kx-page">

    <main class="SignUpMainTag">

        <div class="signUPmain">

            <div class="contcontainerMain">

                <!-- =========================
                     SIGN IN FORM CONTAINER
                ========================== -->
                <div class="signUpform">

                    <!-- LOGO -->
                    <div class="signlogo">
                        <img
                            src="./public/ksamDealPNGImg.png"
                            alt="Ksam Deal Logo"
                        >
                    </div>

                    <!-- FORM CONTENT -->
                    <div class="signformmainContent">

                        <!-- HEADING -->
                        <div class="headpara">
                            <h2 class="signupHead" id="loginTitle">
                                Welcome Back
                            </h2>
                            <p class="signUpPara" id="loginSubtitle">
                                Sign in to your KSAM Deal account
                            </p>
                        </div>

                        <!-- Status Alert Banner -->
                        <div id="authStatusMessage" style="display: none; margin-bottom: 1.125rem; padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.8rem; font-weight: 600; line-height: 1.4; text-align: center;"></div>

                        <!-- SIGN IN MODE TABS -->
                        <div class="kx-auth-tabs" id="authTabsContainer">
                            <button type="button" class="kx-auth-tab-btn active" id="tabPasswordBtn">
                                Password
                            </button>
                            <button type="button" class="kx-auth-tab-btn" id="tabOtpBtn">
                                Login with OTP
                            </button>
                        </div>

                        <!-- SIGN IN FORMS -->
                        <div class="signForm">

                            <!-- =====================================================
                                 TAB 1: PASSWORD LOGIN FORM
                            ====================================================== -->
                            <form id="passwordLoginForm">

                                <!-- EMAIL -->
                                <div>
                                    <label for="loginEmail">
                                        Email Address
                                    </label>
                                    <input
                                        type="email"
                                        name="email"
                                        id="loginEmail"
                                        placeholder="Enter your email"
                                        required
                                        autocomplete="email"
                                    >
                                </div>

                                <!-- PASSWORD -->
                                <div>
                                    <label for="loginPassword">
                                        Password
                                    </label>
                                    <input
                                        type="password"
                                        name="password"
                                        id="loginPassword"
                                        placeholder="Enter your password"
                                        required
                                        autocomplete="current-password"
                                    >
                                </div>

                                <!-- FORGOT PASSWORD -->
                                <div class="forgotPassword">
                                    <a href="./forgot-password.html">
                                        Forgot Password?
                                    </a>
                                </div>

                                <!-- SIGN IN BUTTON -->
                                <div>
                                    <button
                                        id="signButton"
                                        type="submit"
                                    >
                                        Sign In
                                    </button>
                                </div>

                                <!-- GOOGLE / APPLE -->
                                <div class="appGoogle">
                                    <div class="apple">
                                        <img src="./public/apple.png" alt="Apple">
                                        <a href="#" class="appleLink">Continue with Apple</a>
                                    </div>

                                    <div class="googl">
                                        <img src="./public/google.png" alt="Google">
                                        <a href="#" class="googleLink">Continue with Google</a>
                                    </div>
                                </div>

                            </form>

                            <!-- =====================================================
                                 TAB 2: OTP LOGIN REQUEST FORM
                            ====================================================== -->
                            <form id="otpRequestForm" style="display: none;">

                                <div>
                                    <label for="otpLoginEmail">
                                        Email Address
                                    </label>
                                    <input
                                        type="email"
                                        name="email"
                                        id="otpLoginEmail"
                                        placeholder="Enter your registered email"
                                        required
                                        autocomplete="email"
                                    >
                                </div>

                                <div>
                                    <button
                                        id="sendOtpButton"
                                        type="submit"
                                        style="width: 100%; height: 2.9375rem; border: none; outline: none; border-radius: 1.5625rem; background: linear-gradient(135deg, var(--kx-accent, #22ff88) 0%, var(--kx-accent-highlight, #80ffbb) 100%); color: #07090b; font-size: 0.875rem; font-weight: 800; cursor: pointer; transition: transform 0.25s ease, box-shadow 0.25s ease;"
                                    >
                                        Send OTP Code
                                    </button>
                                </div>

                            </form>

                            <!-- =====================================================
                                 VERIFY OTP FORM (For OTP Login & Unverified Users)
                            ====================================================== -->
                            <form id="loginOtpVerifyForm" style="display: none;">

                                <div>
                                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
                                        <label style="margin: 0;">
                                            Enter 6-Digit Code
                                        </label>
                                        <a href="#" id="loginChangeEmailLink" class="kx-change-number">
                                            Change Email
                                        </a>
                                    </div>

                                    <!-- 6 Individual OTP Boxes -->
                                    <div class="kx-otp-boxes" id="loginOtpBoxes">
                                        <input type="text" class="kx-otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="0" autocomplete="one-time-code" aria-label="Digit 1">
                                        <input type="text" class="kx-otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="1" aria-label="Digit 2">
                                        <input type="text" class="kx-otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="2" aria-label="Digit 3">
                                        <input type="text" class="kx-otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="3" aria-label="Digit 4">
                                        <input type="text" class="kx-otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="4" aria-label="Digit 5">
                                        <input type="text" class="kx-otp-digit" maxlength="1" inputmode="numeric" pattern="[0-9]*" data-index="5" aria-label="Digit 6">
                                    </div>
                                </div>

                                <!-- Verify Button -->
                                <div>
                                    <button
                                        id="loginVerifyOtpBtn"
                                        type="submit"
                                        style="width: 100%; height: 2.9375rem; border: none; outline: none; border-radius: 1.5625rem; background: linear-gradient(135deg, var(--kx-accent, #22ff88) 0%, var(--kx-accent-highlight, #80ffbb) 100%); color: #07090b; font-size: 0.875rem; font-weight: 800; cursor: pointer; transition: transform 0.25s ease, box-shadow 0.25s ease;"
                                    >
                                        Verify & Sign In
                                    </button>
                                </div>

                                <!-- Resend OTP & Countdown -->
                                <div class="kx-resend-row">
                                    <span>Didn't receive the email code?</span>
                                    <button type="button" id="loginResendOtpBtn" class="kx-resend-btn" disabled>
                                        Resend Code (<span id="loginResendTimer">60</span>s)
                                    </button>
                                </div>

                            </form>

                        </div>

                    </div>


                    <!-- BOTTOM CONTENT -->
                    <div class="signUplastContent">

                        <div class="signUpLoginLink">
                            <p class="signUplastContfirstTest">
                                Don't have an account?
                                <a href="./signUp.html">
                                    Sign Up
                                </a>
                            </p>
                        </div>

                        <div class="signUpterm">
                            <a href="./terms.html">
                                Terms and Conditions
                            </a>
                        </div>

                    </div>

                </div>


                <!-- =========================
                     RIGHT IMAGE
                ========================== -->
                <div class="signUpimg">
                    <img src="./public/loginImage.png" alt="KSAM Deal">
                </div>

            </div>

        </div>

    </main>

    <script type="module" src="./src/auth/login.js"></script>
</body>

</html>
