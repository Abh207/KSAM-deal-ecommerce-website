<body class="bg-black text-white antialiased" style="margin: 0; background: #000000; color: #ffffff; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; overflow-x: hidden;">

    <!-- React will load the complete product section here -->
    <div id="products-root"></div>
    <script>
      window.addEventListener('error', function() {
        var r = document.getElementById('products-root');
        if (r && (!r.children || r.children.length === 0)) {
          var e = document.getElementById('ksam-err-msg');
          if (!e) {
            e = document.createElement('div');
            e.id = 'ksam-err-msg';
            e.style.cssText = 'padding:40px 20px;text-align:center;font-family:sans-serif;color:#fff;max-width:600px;margin:40px auto;';
            e.innerHTML = '<h2 style="color:#ef4444;font-size:20px;margin-bottom:12px;">Failed to load Shop</h2><p style="color:#9ca3af;margin-bottom:16px;">We encountered an issue loading this page. Please refresh or check your connection.</p><button onclick="window.location.reload()" style="background:#8cff00;color:#050a02;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;">Refresh Page</button>';
            document.body.appendChild(e);
          }
        }
      });
    </script>

    <!-- React Entry File -->
