<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign-UP</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>


    <!-- <video class="signupBackgroundVideo" autoplay muted loop playsinline>
        <source src="../public/backgroundimage2.mp4" type="video/mp4">
    </video> -->

    <main>
        <div class="signUPmain">
            <div class="contcontainerMain">
                <div class="signUpform">
                    <div class="signlogo">
                        <img src="../public/ksamDealPNGImg.png" alt="">
                    </div>
                    <div class="signformmainContent">
                        <div class="headpara">
                            <h2 class="signupHead">
                                Create New Account
                            </h2>
                            <p class="signUpPara">
                                Sign up and get a 30-days free trial
                            </p>
                        </div>
                        <div class="signForm">
                            <form action="">
                                <div>
                                    <label for="fullName">
                                        Full name
                                    </label>
                                    <input type="text" name="name" id="name">
                                </div>
                                <div>
                                    <label for="email">
                                        Email
                                    </label>
                                    <input type="email" name="email" id="email">
                                </div>
                                <div>
                                    <label for="password">
                                        Password
                                    </label>
                                    <input type="password" name="password" id="password">
                                </div>
                                <div>
                                    <button id="signButton">
                                        Submit
                                    </button>
                                </div>
                                <div class="appGoogle">
                                    <div class="apple">
                                        <img src="../public/apple.png" alt="Apple">
                                        <a href="#" class="appleLink">Apple</a>
                                    </div>

                                    <div class="googl">
                                        <img src="../public/google.png" alt="Google">
                                        <a href="#" class="googleLink">Google</a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="signUplastContent">
                        <div class="signUpLoginLink">
                            <p class="signUplastContfirstTest">
                                Have any account? <a href="./login.html">Sign in</a>
                            </p>
                        </div>
                        <div class="signUpterm">
                            <a href="#">
                                Term and Conditions
                            </a>
                        </div>
                    </div>
                </div>
                <div class="signUpimg">
                    <img src="../public/signupimg.png" alt="Image">
                </div>
            </div>
        </div>
    </main>
</body>
</html>
